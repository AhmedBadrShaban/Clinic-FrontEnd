<!-- pop-up-form.component.html -->

<div class="schedule-form-dialog">

  <div class="dialog-header">
    <h2 class="dialog-title">
      <mat-icon>{{ formData.new ? 'add_circle' : 'edit' }}</mat-icon>
      {{ formData.new ? 'Add Doctor Schedule' : 'Edit Doctor Schedule' }}
    </h2>
    <button mat-icon-button (click)="closeDialog()" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form class="dialog-body" (ngSubmit)="formData.new ? create() : edit()">

    <!-- Doctor + Room -->
    <div class="form-row">

      <!-- Doctor autocomplete -->
      <div class="form-group">
        <label class="field-label">Doctor</label>
        <mat-form-field appearance="outline" class="autocomplete-field">
          <input matInput [(ngModel)]="formData.doctorName" name="doctor" [matAutocomplete]="doctorAuto"
            (ngModelChange)="onDoctorSearch($event)" placeholder="Search doctor…">
          <mat-icon matSuffix>person_search</mat-icon>
          <mat-autocomplete #doctorAuto="matAutocomplete">
            <mat-option *ngFor="let doctor of filteredDoctors" [value]="doctor">
              {{ doctor }}
            </mat-option>
            <mat-option *ngIf="filteredDoctors.length === 0" disabled>
              No doctors found
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>

      <!-- Room autocomplete -->
      <div class="form-group">
        <label class="field-label">Room</label>
        <mat-form-field appearance="outline" class="autocomplete-field">
          <input matInput [(ngModel)]="formData.roomName" name="room" [matAutocomplete]="roomAuto"
            (ngModelChange)="onRoomSearch($event)" placeholder="Search room…">
          <mat-icon matSuffix>meeting_room</mat-icon>
          <mat-autocomplete #roomAuto="matAutocomplete">
            <mat-option *ngFor="let room of filteredRooms" [value]="room.roomName">
              {{ room.roomName }}
            </mat-option>
            <mat-option *ngIf="filteredRooms.length === 0" disabled>
              No rooms found
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>

    </div>

    <!-- Date -->
    <div class="form-row center">
      <div class="form-group">
        <label class="field-label">Date</label>
        <input class="field-input" type="date" name="date" [value]="convertDateFormat(formData.date)"
          [(ngModel)]="formData.date" />
      </div>
    </div>

    <!-- Start + End Time -->
    <div class="form-row">
      <div class="form-group">
        <label class="field-label">Start Time</label>
        <input class="field-input" type="time" name="startTime" [(ngModel)]="formData.startTime" />
      </div>
      <div class="form-group">
        <label class="field-label">End Time</label>
        <input class="field-input" type="time" name="endTime" [(ngModel)]="formData.endTime" />
      </div>
    </div>

    <!-- Pulses — only shown for laser rooms -->
    <div class="form-row" *ngIf="isLaser">

      <div class="form-group">
        <label class="field-label">
          Start Pulses
          <span *ngIf="!isAdmin && !startPulsesDisabled" class="once-badge">Fill once</span>
          <span *ngIf="!isAdmin && startPulsesDisabled && !isAdmin" class="locked-badge">
            <mat-icon class="badge-icon">lock</mat-icon> Locked
          </span>
        </label>
        <input class="field-input" type="number" min="0" name="startPulses" [(ngModel)]="formData.startPulses"
          [disabled]="startPulsesDisabled" />
      </div>

      <div class="form-group">
        <label class="field-label">
          End Pulses
          <span *ngIf="!isAdmin && !endPulsesDisabled" class="once-badge">Fill once</span>
          <span *ngIf="!isAdmin && endPulsesDisabled" class="locked-badge">
            <mat-icon class="badge-icon">lock</mat-icon>
            {{ (formData.startPulses == null || formData.startPulses === 0) ? 'Fill start first' : 'Locked' }}
          </span>
        </label>
        <input class="field-input" type="number" min="0" name="endPulses" [(ngModel)]="formData.endPulses"
          [disabled]="endPulsesDisabled" />
      </div>

    </div>

    <!-- Non-laser room hint -->
    <div *ngIf="formData.roomName && !isLaser" class="non-laser-hint">
      <mat-icon>info_outline</mat-icon>
      Pulse fields are not available for non-laser rooms.
    </div>

    <!-- Actions -->
    <div class="dialog-actions">
      <button type="button" mat-stroked-button (click)="closeDialog()">
        Cancel
      </button>
      <button type="submit" mat-raised-button [color]="formData.new ? 'primary' : 'accent'" [disabled]="isSubmitting">
        <mat-spinner *ngIf="isSubmitting" diameter="18" class="btn-spinner"></mat-spinner>
        <mat-icon *ngIf="!isSubmitting">{{ formData.new ? 'add' : 'save' }}</mat-icon>
        {{ isSubmitting ? 'Saving…' : (formData.new ? 'Add Schedule' : 'Save Changes') }}
      </button>
    </div>

  </form>
</div>
