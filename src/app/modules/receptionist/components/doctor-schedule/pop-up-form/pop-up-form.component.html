<div class="border border-2 border-primary rounded container overflow-hidden" style="width:600px; height:510px; background-color: #E5E5E5;">
  <div class="row mt-4 text-center"><h1 style="font-size: 33; color: black; font-weight: 800;">Doctor Scheduler</h1></div>
  <form (ngSubmit)="onSubmit()">
    <div class="row my-3 justify-content-between">
      <div class="col-5">
        <label class="form-label w-100 text-center">Doctor</label>
        <select class="form-select" [(ngModel)]="formData.doctorName" name="doctor">
          <option *ngIf="formData.doctorName" selected>{{formData.doctorName}}</option>
          <option *ngIf="!formData.doctorName" selected disabled>Select Doctor</option>
          <option *ngFor="let doctor of doctors" [ngValue]="doctor">{{ doctor }}</option>
        </select>
      </div>
      <div class="col-5">
        <label class="form-label w-100 text-center">Room</label>
        <select class="form-select" [(ngModel)]="formData.roomName" name="room">
          <option *ngIf="formData.roomName" selected>{{formData.roomName}}</option>
          <option *ngIf="!formData.roomName" selected disabled>Select Room</option>
          <option *ngFor="let room of rooms" [ngValue]="room.roomName">{{ room.roomName}}</option>

        </select>
      </div>
    </div>

    <div class="row my-3 justify-content-center">
      <div class="col-5">
        <div class="cs-form smaller-mat-form-field w-100">
          <label class="form-label w-100 text-center" for="date">Date</label>
           <input name="date" type="date" class="form-control" value="{{convertDateFormat(formData.date)}}" name="date"  [(ngModel)]="formData.date" />
        </div>
      </div>
    </div>

    <div class="row my-3 justify-content-between">
      <div class="col-5">
        <div class="cs-form smaller-mat-form-field w-100">
          <label class="form-label w-100 text-center" for="time">Start Time</label>
          <input name="time" type="time" class="form-control" value="{{formData.startTime}}"  [(ngModel)]="formData.startTime" name="startTime" />
        </div>
      </div>
      <div class="col-5">
        <div class="cs-form smaller-mat-form-field w-100">
          <label class="form-label w-100 text-center" for="time">End Time</label>
          <input name="time" type="time" class="form-control"  value="{{formData.endTime}}" [(ngModel)]="formData.endTime" name="endTime" />
        </div>
      </div>
    </div>

    <div class="row my-3 justify-content-between">
      <div class="col-5">
        <div class="cs-form smaller-mat-form-field w-100">
          <label class="form-label w-100 text-center" for="startPulses">Pulses Start</label>
          <input  [disabled]=" !isLaserRoom(formData.roomName)  || !formData.new && !isAdmin &&  disableStartPulses" type="number" id="startPulses" class="form-control"  value="0" [(ngModel)]="formData.startPulses" name="startPulses" />
        </div>
      </div>
      <div class="col-5">
        <div class="cs-form smaller-mat-form-field w-100">
          <label class="form-label w-100 text-center" for="endPulses">Pulses End</label>
          <input  [disabled]=" !isLaserRoom(formData.roomName) || disableEndPulse && !isAdmin" type="number" id="endPulses" class="form-control"  value="0"  [(ngModel)]="formData.endPulses" name="endPulses" />
        </div>
      </div>
    </div>

    <div class="mt-3 d-flex justify-content-center">
      <div *ngIf="!formData.new" class="mx-1">
        <button type="submit" class="btn btn-warning" (click)=" edit()">Edit Schedule</button>
      </div>
      <div  *ngIf="formData.new" class="mx-1">
        <button type="submit" class="btn btn-warning" (click)=" create()">Add Schedule</button>
      </div>
      <div class="mx-1">
        <button class="btn btn-danger" (click)="closeDialog()">Cancel</button>
      </div>
    </div>
  </form>
</div>
