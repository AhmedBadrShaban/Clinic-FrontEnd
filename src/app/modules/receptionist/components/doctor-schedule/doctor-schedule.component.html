<!-- doctor-schedule.component.html -->

<div class="schedule-page">

  <!-- ── Toolbar ─────────────────────────────────────────── -->
  <div class="schedule-toolbar">

    <button mat-raised-button color="primary" class="add-btn" (click)="openDialog({ new: true })">
      <mat-icon>add</mat-icon>
      Add Schedule
    </button>

    <!-- Date picker -->
    <mat-form-field appearance="outline" class="toolbar-field">
      <mat-label>Filter by date</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="selectedDate" (dateChange)="onDateChange($event)" readonly
        placeholder="Pick a date">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- Search -->
    <mat-form-field appearance="outline" class="toolbar-field toolbar-search">
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="searchValue" placeholder="Doctor, room, date…" (keyup.enter)="search(searchValue)">
      <button *ngIf="searchValue" matSuffix mat-icon-button (click)="clearSearch()" matTooltip="Clear search">
        <mat-icon>close</mat-icon>
      </button>
      <mat-icon *ngIf="!searchValue" matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-raised-button color="accent" (click)="search(searchValue)">
      <mat-icon>search</mat-icon>
      Search
    </button>

  </div>

  <!-- ── Search mode banner ─────────────────────────────── -->
  <div *ngIf="isSearchMode" class="search-banner">
    <mat-icon>info_outline</mat-icon>
    Showing search results for <strong>"{{ searchValue }}"</strong> — date filter is paused.
    <button mat-button color="primary" (click)="clearSearch()">Back to date filter</button>
  </div>

  <!-- ── Loading bar ────────────────────────────────────── -->
  <mat-progress-bar *ngIf="isLoading" mode="indeterminate" class="loading-bar"></mat-progress-bar>

  <!-- ── Table ──────────────────────────────────────────── -->
  <nz-table class="schedule-table" #dynamicTable [nzScroll]="{ x: scrollX, y: scrollY }" [nzData]="listOfData"
    [nzTableLayout]="settingValue.tableLayout" [nzBordered]="settingValue.bordered" [nzOuterBordered]="true"
    [nzLoading]="isLoading" [nzPaginationType]="settingValue.paginationType"
    [nzPaginationPosition]="settingValue.position" [nzFrontPagination]="settingValue.pagination"
    [nzShowPagination]="settingValue.pagination" [nzSize]="settingValue.size">

    <thead>
      <tr>
        <th nzAlign="center">Room</th>
        <th nzAlign="center">Doctor</th>
        <th nzAlign="center">Date</th>
        <th nzAlign="center">Start</th>
        <th nzAlign="center">End</th>
        <th nzAlign="center">Status</th>
        <th nzAlign="center">Actions</th>
      </tr>
    </thead>

    <tbody>
      <ng-container *ngFor="let data of dynamicTable.data">
        <tr class="schedule-row">
          <td nzAlign="center">{{ data.roomName }}</td>
          <td nzAlign="center">{{ data.doctorName }}</td>
          <td nzAlign="center" class="date-cell">{{ data.date }}</td>
          <td nzAlign="center">{{ formatTimeTo12Hour(data.startTime) }}</td>
          <td nzAlign="center">{{ formatTimeTo12Hour(data.endTime) }}</td>

          <!-- Status cell -->
          <td nzAlign="center">
            <ng-container *ngIf="data.confirmed; else notConfirmed">
              <button mat-stroked-button class="status-btn confirmed" [disabled]="!isAdmin"
                (click)="isAdmin && changeConfirmStatus(data.schedulerId)">
                <mat-icon>check_circle</mat-icon>
                Confirmed
              </button>
            </ng-container>
            <ng-template #notConfirmed>
              <button mat-stroked-button class="status-btn pending" (click)="changeConfirmStatus(data.schedulerId)">
                <mat-icon>pending</mat-icon>
                Not Confirmed
              </button>
            </ng-template>
          </td>

          <!-- Actions -->
          <td nzAlign="center">
            <button mat-icon-button color="primary" matTooltip="Edit schedule" (click)="openDialog({
                      new: false,
                      schedulerId: data.schedulerId,
                      roomName: data.roomName,
                      doctorName: data.doctorName,
                      date: data.date,
                      startTime: data.startTime,
                      endTime: data.endTime,
                      startPulses: data.startPulses,
                      endPulses: data.endPulses
                    })">
              <mat-icon>edit</mat-icon>
            </button>

            <button *ngIf="isAdmin" mat-icon-button color="warn" matTooltip="Delete schedule"
              (click)="deleteSchedule(data.schedulerId)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>

        </tr>
      </ng-container>
    </tbody>
  </nz-table>

</div>
