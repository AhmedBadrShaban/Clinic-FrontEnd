
<div class="border  rounded container  shadow"
    style="width:600px; background-color: #F8F8F8;border: none;">

    <form [formGroup]="newPatientFm" (ngSubmit)="submit()">

        <div class="row m-2 justify-content-between">
            <div class="d-flex align-items-center">
                <i class="bi bi-person me-2 fs-4" style="margin-bottom: 7px;"></i>
                <label class="form-label w-100">Patient Name</label>
            </div>
            <input type="text" formControlName="name" id="name" class="form-control shadow" name="name" />


        </div>
        <div class="row m-2 mt-3 justify-content-between">
            <div class="d-flex align-items-center">
                <i class="bi bi-gender-ambiguous me-2 fs-4" style="margin-bottom: 5px;"></i>
                <label class="form-label w-100">Gender</label>
            </div>
            <select class="form-select shadow" name="gender" formControlName="gender">
                <option value="">Select Gender</option>

                <option value="male" >male</option>
                <option value="female" >female</option>
            </select>
        </div>

        <div class="row m-2 mt-4 justify-content-between">
            <div class="col-5">
                <div class="row">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-whatsapp me-2 fs-4" style="margin-bottom: 7px;"></i>

                        <label class="form-label w-100">Phone Number</label>
                    </div>
                    <input type="text" formControlName="primaryPhone" id="phone1" class="form-control shadow" name="phone1" />

                </div>

            </div>

            <div class="col-5">
                <div class="row">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 5px;"></i>
                        <label class="form-label w-100">Phone Number</label>
                    </div>
                    <input type="text" formControlName="secondaryPhone" id="phone2" class="form-control shadow" name="phone2" />

                </div>

            </div>

        </div>

        <div class="row m-2 mt-4 justify-content-between">
            <div class="col-5">
                <div class="row">

                    <div class="d-flex align-items-center">
                        <i class="bi bi-calendar-week me-2 fs-4" style="margin-bottom: 5px;"></i>
                        <label class="form-label w-100 ">Date</label>
                    </div>
                    <input type="date" formControlName="date" class="form-control shadow" name="date" id="date-input"
                        placeholder="Date">
                </div>

                <div class="row" style="margin-top: 8px;">

                    <div class="d-flex align-items-center">
                        <i class="bi bi-binoculars me-2 fs-4" style="margin-bottom: 5px;"></i>
                        <label class="form-label w-100 ">KnowUsThrough</label>
                    </div>
                    <input type="text" formControlName="knowUsThrough" id="knowus" class="form-control shadow" name="knowus" />

                </div>
            </div>
            <div class="col-6">

                <div class="d-flex align-items-center">
                    <i class="bi bi-card-text me-2 fs-4" style="margin-bottom: 5px;"></i>
                    <label class="form-label w-100 ">Note</label>
                </div>
                <textarea id="note" rows="4" placeholder="Note" formControlName="note" class="form-control shadow"></textarea>

            </div>


        </div>



        <div class="mt-3 d-flex justify-content-center" style=" margin-bottom: 25px;">
            <button type="submit"
                style="width: 160px; height: 40px; background-color: green; color: #fff; border: none; border-radius: 4px;">Add
                Patient
            </button>

        </div>
    </form>
</div>
