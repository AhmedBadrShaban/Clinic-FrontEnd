
<!-- Step 1: Points summary section -->
<div style="margin-bottom: 20px; display: flex; flex-direction: column; align-items: center;">
  <div style="display: flex; width: 100%; justify-content: space-around;">
    <div>
      Total In : <span style="color: black;" class="bg-info badge">{{totalIn}}</span>
    </div>
    <div>
      Total out : <span style="color: black;" class="bg-info badge">{{totalOut}}</span>
    </div>
    <div>
      Remain : <span style="color: black;" class="bg-info badge">{{remain}}</span>
    </div>
  </div>
  <button class="btn btn-primary mt-3" (click)="openModal()">
    Send Points
  </button>
</div>

<!-- Step 2: Use the shared material table component -->
<app-table
  [data]="dataSource.data"
  [columns]="tableColumns"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage + 1"
  (onPageChange)="onPageChange($event)">
</app-table>

<!-- Step 3: Custom cell template for notes column -->
<ng-template #noteTemplate let-row>
  <span style="font-size: 12px; color: blueviolet; text-decoration: underline;">
    {{ row.note }}
  </span>
</ng-template>
