 
<!-- Points summary -->
<div class="points-summary">
  <div class="summary-cards">

    <div class="summary-card total-in">
      <mat-icon>trending_up</mat-icon>
      <div class="summary-info">
        <span class="summary-label">Total In</span>
        <span class="summary-value">{{ totalIn }}</span>
      </div>
    </div>

    <div class="summary-card total-out">
      <mat-icon>trending_down</mat-icon>
      <div class="summary-info">
        <span class="summary-label">Total Used</span>
        <span class="summary-value">{{ totalOut }}</span>
      </div>
    </div>

    <div class="summary-card remain">
      <mat-icon>stars</mat-icon>
      <div class="summary-info">
        <span class="summary-label">Remaining</span>
        <span class="summary-value">{{ remain }}</span>
      </div>
    </div>

  </div>

  <button mat-raised-button color="primary" class="send-btn" (click)="openModal()">
    <mat-icon>swap_horiz</mat-icon>
    Transfer Points
  </button>
</div>

<!-- Table -->
<app-table
  [data]="dataSource.data"
  [columns]="tableColumns"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage + 1"
  (onPageChange)="onPageChange($event)">
</app-table>

<!-- Note template -->
<ng-template #noteTemplate let-row>
  <span class="note-cell">{{ row.note }}</span>
</ng-template>
