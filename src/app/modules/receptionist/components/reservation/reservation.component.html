<div class="content">
  <!-- Search Section -->
  <div *ngIf="showSearchSection" class="search-container w-75 mx-auto mb-4">
    <div class="search-row d-flex justify-content-center align-items-center" style="min-height: 60px;">
      
      <!-- Search Input with Loading State -->
      <div class="search-input-container position-relative w-50 mx-2">
        <input
          class="form-control h-100 bg-light search-input"
          [class.is-loading]="isLoading"
          id="patient-search"
          placeholder="Search by name or phone number..."
          type="search"
          [(ngModel)]="searchValue"
          (ngModelChange)="onSearchValueChange($event)"
          [matAutocomplete]="PatientAuto"
          [disabled]="isLoading"
          autocomplete="off"
        />
        
        <!-- Loading Spinner -->
        <div *ngIf="isLoading" class="loading-spinner position-absolute">
          <i class="fas fa-spinner fa-spin"></i>
        </div>
        
        <!-- Search Icon -->
        <div *ngIf="!isLoading" class="search-icon position-absolute">
          <i class="bi bi-search text-muted"></i>
        </div>
        
        <!-- Material Autocomplete -->
        <mat-autocomplete 
          #PatientAuto="matAutocomplete"
          (optionSelected)="onPatientSelected($event)">
          <mat-option 
            *ngFor="let option of filteredData; trackBy: trackByFn" 
            [value]="option">
            <div class="autocomplete-item">
              <i class="bi bi-person-fill me-2 text-primary"></i>
                {{ option }}
             </div>
          </mat-option>
        </mat-autocomplete>
      </div>
            
      <!-- Search Button -->
      <div class="mx-2">
        <button 
          (click)="searchPatient()" 
          type="button" 
          class="btn btn-primary search-btn h-100 px-4"
          [disabled]="!searchValue || isLoading"
          [class.btn-loading]="isLoading"
        >
          <i class="bi bi-search me-2"></i>
          <span>Search</span>
        </button>
      </div>
      
      <!-- Add New Patient Button -->
      <div *ngIf="canAddNewPatient" class="mx-2">
        <button
          (click)="openDialog()"
          class="btn btn-success add-patient-btn"
          style="height: 50px; min-width: 180px;"
          [disabled]="isLoading"
        >
          <i class="bi bi-person-plus me-2"></i>
          <span>New Patient</span>
        </button>
      </div>
    </div>
  </div>

   <div class="tabs-container">
    <mat-tab-group 
      [(selectedIndex)]="selectedTabIndex"
      (selectedIndexChange)="onTabSelectChange($event)"
      class="patient-tabs"
      mat-align-tabs="center"
      backgroundColor="accent"
      color="primary">
      
      <!-- Main Info Tab (Not for Doctor) -->
      <mat-tab *ngIf="userType !== 'ROLE_DOCTOR'" label="Patient Info">
        <div class="tab-content-wrapper">
          <app-patient-info
            [phoneNumber]="patientNumber"
            [info]="PatientInfo">
          </app-patient-info>
        </div>
      </mat-tab>
      
      <!-- History Tab -->
      <mat-tab label="History">
        <div class="tab-content-wrapper">
          <app-history>
          </app-history>
        </div>
      </mat-tab>
      
      <!-- Packages Tab (Not for Doctor) -->
      <mat-tab *ngIf="userType !== 'ROLE_DOCTOR'" label="Packages">
        <div class="tab-content-wrapper">
          <app-packages>
          </app-packages>
        </div>
      </mat-tab>
      
      <!-- Points Tab (Not for Doctor) -->
      <mat-tab *ngIf="userType !== 'ROLE_DOCTOR'" label="Points">
        <div class="tab-content-wrapper">
          <app-points>
          </app-points>
        </div>
      </mat-tab>
      
      <!-- Reservations Tab (Not for Doctor) -->
      <mat-tab *ngIf="userType !== 'ROLE_DOCTOR'" label="Reservations">
        <div class="tab-content-wrapper">
          <app-reservations>
          </app-reservations>
        </div>
      </mat-tab>
      
      <!-- Payment History Tab (Not for Doctor) -->
      <mat-tab *ngIf="userType !== 'ROLE_DOCTOR'" label="Payment History">
        <div class="tab-content-wrapper">
          <app-payment-history>
          </app-payment-history>
        </div>
      </mat-tab>
      
      <!-- Doctor: Treatment Notes Tab -->
      <mat-tab *ngIf="userType === 'ROLE_DOCTOR'" label="After Work">
        <div class="tab-content-wrapper">
          <app-after-work
            [phoneNumber]="patientNumber"
            [id]="reservationID">
          </app-after-work>
        </div>
      </mat-tab>
      
       <mat-tab *ngIf="userType === 'ROLE_ADMIN'" label="Idle Patients">
        <div class="tab-content-wrapper">
          <app-idle-patients></app-idle-patients>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
