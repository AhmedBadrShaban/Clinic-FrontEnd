<div class="content">
  <div *ngIf="userType!='ROLE_DOCTOR'" class="w-75 mx-auto">
    <div class="d-flex justify-content-center" style="height: 50px;">
      <div class="w-50 mx-2">
        <input  class="form-control h-100 bg-light" id="patient-number"
        placeholder="search" type="search"
        nz-input
        [(ngModel)]="searchValue"
        [ngModelOptions]="{standalone: true}"
        (ngModelChange)="onChange($event)"
        [nzAutocomplete]="PatientAuto"
      />
      <nz-autocomplete [nzDataSource]="filteredData" #PatientAuto></nz-autocomplete>
      </div>
      <div class="mx-2">
        <button (click)="search()"  type="button" class="btn btn-info h-100">
          <i class="bi bi-search"></i>
        </button>
       </div>
      <div *ngIf="userType=='ROLE_ADMIN'" class="mx-2 align-self-end">
        <button (click)="openDialog()" class="btn btn-info" style="width: 200px; height: 50px;"> <span class="bi bi-plus"></span> New Patient</button>
      </div>
    </div>
  </div>

  <nz-tabset nzCentered style="padding-top: 2%">

    <nz-tab *ngIf="userType=='ROLE_ADMIN'" nzTitle="Idle Patients">
      <app-idle-patients></app-idle-patients>
    </nz-tab>
    <nz-tab *ngIf="userType!='ROLE_DOCTOR'"  nzTitle="Main Info">
      <app-patient-info [info]="PatientInfo"></app-patient-info>
    </nz-tab>
    <nz-tab id="history" nzTitle="History">
      <app-history [history]="patientHistory"></app-history>
    </nz-tab>
    <nz-tab  *ngIf="userType!='ROLE_DOCTOR'" id="packages" nzTitle="Packages">
      <app-packages [packages]="patientPackages"></app-packages>
    </nz-tab>
    <nz-tab  *ngIf="userType!='ROLE_DOCTOR'" id="points" nzTitle="Points">
      <app-points [patientNumber]="PatientInfo.primaryPhone" [pointsHistory]="pointsHistory" [totalIn]="totalIn" [totalOut]="totalOut"></app-points>
    </nz-tab>
    <nz-tab  *ngIf="userType!='ROLE_DOCTOR'" nzTitle="Reservations">
      <app-reservations [reservations]="patientReservations"> </app-reservations>
    </nz-tab>
    <nz-tab  *ngIf="userType!='ROLE_DOCTOR'" nzTitle="Payment History">
      <app-payment-history [paymentHistory]="patientReservations"> </app-payment-history>
    </nz-tab>
    <nz-tab *ngIf="userType=='ROLE_DOCTOR'" nzTitle="After Work">
       <app-after-work></app-after-work>
    </nz-tab>
  </nz-tabset>

</div>
