<div  class="Header w-100">
  Package Information
</div>
<div  *ngIf="packDetails"  class="Content">
  <table>
    <tr>
      <th scope="col"> Number of Points</th>
      <td> {{packDetails.numberOfPoints}}</td>
    </tr>
    <tr>
      <th> Clinic </th>
      <td> {{packDetails.clinicName}} </td>
    </tr>
    <tr>
      <th>Expire</th>
      <td>{{packDetails.expire}}</td>
    </tr>
    <tr>
      <th>Date Of Reservation</th>
      <td>{{packDetails.reservedAt}}</td>
    </tr>
  </table>
  <div class="header-Service"  *ngIf="servicePack">
    Package Services
  </div>
  <div class="my-2 ">
    <table  *ngIf="servicePack">
      <thead>
        <tr>
          <th class="me-4">Service Name</th>
          <th>Sessions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let service of packDetails.reservedService" >
          <td class="me-4">{{service.serviceName}}</td>
          <td>{{service.sessions}}</td>
        </tr>
      </tbody>
   </table>
  </div>


 <div class="d-flex justify-content-around" >
  <button   style="font-size:12px;" class="btn btn-info m-2" (click)="openUpdatePackage()">Update</button>
  <button   style="font-size:12px;" class="btn btn-danger m-2" (click)="closeDialog()">Close</button>

</div>
</div>
