<div class=" mx-auto my-2 d-flex justify-content-between overflow-hidden "    style="width:90%; height: 50px;">
    <div class="h-100"> <a (click)="openDialog('expense')" class="btn btn-info h-100" style="line-height: 40px;" > <i class="bi bi-plus"></i> Add nw Expense </a></div>
    <div class="h-100" *ngIf="userType=='ROLE_ADMIN'"> <a (click)="openDialog('type')" class="btn btn-info h-100" style="line-height: 40px;" > <i class="bi bi-plus"></i> Add Expense Type </a></div>

    <!-- <div class="h-100"> <a  class="btn btn-info h-100" style="line-height: 40px;"> <i class="bi bi-plus"></i> Add Company Expense </a></div> -->

    <div class="h-100">
      <mat-form-field>
        <mat-label>Choose a date</mat-label>
        <input matInput [(ngModel)]="selectedDate" (dateChange)="onDateChange($event)" [matDatepicker]="picker">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="h-100">
      <button mat-button class="custom-gray-button" (click)="clearFilter()">Clear Filters</button>
  </div>
  </div>
    <app-table
 [data]="dataSource.data"
  [columns]="tableColumns"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage + 1"
  (onPageChange)="onPageChange($event)">
</app-table>
