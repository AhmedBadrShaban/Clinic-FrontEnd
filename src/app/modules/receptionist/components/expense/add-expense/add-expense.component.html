
    <div class="border border-2 border-primary rounded container overflow-hidden"
      style="width:600px; background-color: #E5E5E5;">

      <div class="row mt-2 text-center">
        <h1 style="font-size: 33; color: black; font-weight: 800;">New Expense</h1>
      </div>
      <form [formGroup]="expenseFm" (ngSubmit)="submit()">
        <div class="row m-2 justify-content-between">
          <label class="form-label w-100 " for="Amount">Amount</label><br>
          <input type="number" class="form-control" id="text-input" placeholder="Amount" formControlName="amount">
        </div>
        <div class="row m-2 justify-content-between">
          <label for="Expense Type" class="form-label w-100 ">Expense Type</label>
          <select id="select-options" formControlName="type" class="form-select">
            <option disabled selected>Select Expense Type</option>
             <option *ngFor="let expenseType of types" [value]="expenseType">{{ expenseType }}</option>
          </select>

        </div>

        <div class="row m-2 justify-content-between">
          <label for="Note" class="form-label w-100 ">Note</label>
          <textarea id="note" rows="3" placeholder="Note" formControlName="note" class="form-control"></textarea>

        </div>

        <div class="row m-2 justify-content-between">
          <label for="receipt" class="form-label w-100">Receipt..</label><br>
          <label for="file-upload" class="file-upload-label px-2" style="width: 555px;color: rgb(173, 169, 169);">
            <span *ngIf="flag" style="color: black;">{{ selectedFileName}}</span>
            <span *ngIf="!flag">Reciept</span>
            <input id="file-input" type="file" (change)="onFileSelected($event)" formControlName="image"
              style="display: none;">
            <i class="fas fa-cloud-upload-alt" onclick="document.getElementById('file-input').click()"></i>
          </label><br>
        </div>
        <div class="mt-3 d-flex justify-content-center" style=" margin-bottom: 25px;">
          <button type="submit" style="width: 100px; height: 30px; background-color: #1E3A8A; color: #fff;
               border: none; border-radius: 4px;">
            Add
          </button>

        </div>
      </form>
    </div>
