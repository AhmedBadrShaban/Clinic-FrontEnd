<div class="receptionist-shell" [class.sidebar-collapsed]="navbar.isCollapsed">

  <app-nav-bar #navbar (isCollapsedChange)="onSidebarToggle($event)"></app-nav-bar>

  <div class="receptionist-main">

    <!-- Top bar -->
    <header class="receptionist-topbar">
      <div class="topbar-left">
        <!-- Hamburger: mobile only -->
        <button class="hamburger-btn" (click)="navbar.mobileOpen = true" title="Open menu">
          <i class="bi bi-list"></i>
        </button>
        <span class="page-title">{{ navbar.currentPageTitle }}</span>
      </div>
      <div class="topbar-right">
        <span class="clinic-name">U Clinic</span>
        <div class="avatar" title="Receptionist">R</div>
      </div>
    </header>

    <!-- Routed page content -->
    <main class="receptionist-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
