 <div class="mat-elevation-z8 m-5">
  <table mat-table [dataSource]="data" class="mat-table" matSort>

    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column.key">
      <th mat-header-cell *matHeaderCellDef mat-sort-header align="center">{{ column.label }}</th>
      <td mat-cell *matCellDef="let row" align="center">
        <ng-container *ngIf="!column.template">
          {{ row[column.key] }}
        </ng-container>
        <ng-container *ngIf="column.template">
          <ng-container *ngTemplateOutlet="column.template; context: { $implicit: row }"></ng-container>
        </ng-container>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumnsKeys"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumnsKeys;"></tr>
  </table>

  <mat-paginator
    [length]="totalItems"
    [pageSize]="pageSize"
    [pageIndex]="currentPage - 1"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange.emit($event)">
  </mat-paginator>
</div>
