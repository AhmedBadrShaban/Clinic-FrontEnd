<div class="table-container mat-elevation-z8">

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && (!data || data.length === 0)">
    <div class="empty-content">
      <mat-icon class="empty-icon">inbox</mat-icon>
      <h3 class="empty-title">{{ emptyTitle || 'No Data Available' }}</h3>
      <p class="empty-message">{{ emptyMessage || 'There are no records to display at this time.' }}</p>
    </div>
  </div>

  <table mat-table [dataSource]="data" class="enhanced-mat-table" [class.table-loading]="isLoading" matSort
    *ngIf="!isLoading && data && data.length > 0">
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column.key">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="enhanced-header" align="center">
        <span class="header-text">{{ column.label }}</span>
      </th>

      <td mat-cell *matCellDef="let row" class="enhanced-cell" align="center">
        <!-- No template case -->
        <ng-container *ngIf="!column.template">
          <span class="cell-content">
            <!-- Check if it's the 'time' column -->
            <ng-container *ngIf="column.key === 'time'; else normalCell">
              {{ ('1970-01-01T' + row[column.key]) | date: 'h:mm:ss a' }}
            </ng-container>
            <ng-template #normalCell>
              {{ row[column.key] }}
            </ng-template>
          </span>
        </ng-container>

        <!-- Template case -->
        <ng-container *ngIf="column.template">
          <ng-container *ngTemplateOutlet="column.template; context: { $implicit: row }"></ng-container>
        </ng-container>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumnsKeys" class="enhanced-header-row"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumnsKeys;" class="enhanced-data-row"></tr>
  </table>

  <mat-paginator class="enhanced-paginator" [length]="totalItems" [pageSize]="pageSize" [pageIndex]="currentPage - 1"
    [pageSizeOptions]="[5, 10, 20]" (page)="onPageChange.emit($event)" *ngIf="!isLoading && data && data.length > 0">
  </mat-paginator>
</div>
