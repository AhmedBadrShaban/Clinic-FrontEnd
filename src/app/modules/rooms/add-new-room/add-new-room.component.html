<div
  class="border rounded container shadow"
  style="width: 600px; background-color: #f8f8f8; border: none"
>
  <form [formGroup]="newRoomFm" (ngSubmit)="submit()">
    <div class="row m-2 justify-content-between">
      <div class="d-flex align-items-center">
        <!-- <i class="bi bi-screwdriver me-2 fs-4" style="margin-bottom: 7px;"></i> -->
        <label class="form-label w-100">Room Name</label>
      </div>
      <input
        type="text"
        formControlName="roomName"
        placeholder="Room Name"
        id="name"
        class="form-control shadow"
      />
    </div>
 
    <div class="row m-2 mt-3 justify-content-between">
      <div class="col-5">
        <div class="row">
          <div class="d-flex align-items-center">
            <i class="bi bi-house me-2 fs-4" style="margin-bottom: 7px"></i>
            <label class="form-label w-100">Clinic</label>
          </div>
          <select
            formControlName="clinicName"
            id="clinic"
            class="form-control shadow"
          >
            <option value="" disabled>Select Clinic</option>
            <option *ngFor="let clinic of clinics" [value]="clinic">{{ clinic }}</option>
          </select>
          <div *ngIf="newRoomFm.get('clinic')?.hasError('required') && newRoomFm.get('clinic')?.touched">
            Clinic is required.
          </div>
        </div>
      </div>

      <div class="col-5">
       <div class="row">
        <div class="d-flex align-items-center">
          <!-- <i class="bi bi-currency-pound me-2 fs-4" style="margin-bottom: 7px;"></i> -->
          <label class="form-label w-100">is Laser or Not</label>
          </div>
        <select class="form-select shadow" id="laser" formControlName="isLaser">
          <option selected disabled>Choose </option>
          <option value="true" >Yes</option>
          <option value="false" >No</option>
        </select>
       </div>
      </div>
    </div>

    <div class="mt-3 d-flex justify-content-center" style="margin-bottom: 25px">
      <button
        type="submit"
        style="
          width: 180px;
          height: 40px;
          background-color: green;
          color: #fff;
          border: none;
          border-radius: 4px;
        "
      >
        Add Room
      </button>
    </div>
  </form>
</div>
