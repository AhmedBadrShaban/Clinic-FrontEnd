<div class="border rounded container shadow" style="width: 600px; background-color: #f8f8f8; border: none">
  <form [formGroup]="newRoomFm" (ngSubmit)="submit()">
    <!-- Room Name -->
    <div class="row m-2 justify-content-between">
      <div class="d-flex align-items-center">
        <label class="form-label w-100">Room Name</label>
      </div>
      <input type="text" formControlName="roomName" placeholder="Room Name" id="name" class="form-control shadow" />
      <div *ngIf="newRoomFm.get('roomName')?.hasError('required') && newRoomFm.get('roomName')?.touched"
        class="text-danger mt-1">
        Room name is required.
      </div>
      <div *ngIf="newRoomFm.get('roomName')?.hasError('pattern') && newRoomFm.get('roomName')?.touched"
        class="text-danger mt-1">
        Room name must be at least 3 letters.
      </div>
    </div>

    <!-- Clinic and Laser Type Row -->
    <div class="row m-2 mt-3 justify-content-between">
      <div class="col-5">
        <div class="row">
          <div class="d-flex align-items-center">
            <i class="bi bi-house me-2 fs-4" style="margin-bottom: 7px"></i>
            <label class="form-label w-100">Clinic</label>
          </div>
          <select formControlName="clinicName" id="clinic" class="form-control shadow">
            <option value="" disabled>Select Clinic</option>
            <option *ngFor="let clinic of clinics" [value]="clinic">{{ clinic }}</option>
          </select>
          <div *ngIf="newRoomFm.get('clinicName')?.hasError('required') && newRoomFm.get('clinicName')?.touched"
            class="text-danger mt-1">
            Clinic is required.
          </div>
        </div>
      </div>
      <div class="col-5">
        <div class="row">
          <div class="d-flex align-items-center">
            <label class="form-label w-100">is Laser or Not</label>
          </div>
          <select class="form-select shadow" id="laser" formControlName="isLaser">
            <option value="" disabled>Choose</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
          <div *ngIf="newRoomFm.get('isLaser')?.hasError('required') && newRoomFm.get('isLaser')?.touched"
            class="text-danger mt-1">
            Please select laser type.
          </div>
        </div>
      </div>
    </div>

    <!-- Parent Room Selection -->
    <div class="row m-2 mt-3 justify-content-between">
      <div class="d-flex align-items-center">
        <i class="bi bi-diagram-3 me-2 fs-4" style="margin-bottom: 7px"></i>
        <label class="form-label w-100">Parent Room</label>
      </div>
      <select formControlName="parentRoomId" id="parentRoom" class="form-control shadow"
        [disabled]="!newRoomFm.get('clinicName')?.value || isLoadingParentRooms">
        <option value="" disabled>
          {{ isLoadingParentRooms ? 'Loading rooms...' : 'Select Parent Room' }}
        </option>
        <option *ngFor="let room of parentRooms" [value]="room.roomId">
          {{ room.roomName }}
        </option>
      </select>
      <div *ngIf="newRoomFm.get('parentRoomId')?.hasError('required') && newRoomFm.get('parentRoomId')?.touched"
        class="text-danger mt-1">
        Parent room is required.
      </div>
      <div *ngIf="!newRoomFm.get('clinicName')?.value" class="text-muted mt-1 small">
        Please select a clinic first to see available parent rooms.
      </div>
    </div>

    <!-- Submit Button -->
    <div class="mt-3 d-flex justify-content-center" style="margin-bottom: 25px">
      <button type="submit" [disabled]="newRoomFm.invalid || isLoadingParentRooms" style="
          width: 180px;
          height: 40px;
          background-color: green;
          color: #fff;
          border: none;
          border-radius: 4px;
        " [style.opacity]="newRoomFm.invalid || isLoadingParentRooms ? '0.6' : '1'">
        {{ isLoadingParentRooms ? 'Loading...' : 'Add Room' }}
      </button>
    </div>
  </form>
</div>
