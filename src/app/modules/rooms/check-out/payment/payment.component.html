
<div class="border border-2 border-primary rounded container overflow-hidden"
  style="width:600px; background-color: #E5E5E5;">

  <div class="row mt-2 text-center">
    <h1 style="font-size: 33; color: black; font-weight: 800;">Payment Methods</h1>
  </div>

  <form (submit)="submit()">
    <div class="row m-2 justify-content-between">
      <label for="Payment" class="form-label w-100" >Payment Method</label><br>
      <div class="col">
        <input type="number" placeholder="Cash" id="cash" [(ngModel)]="paymentData.cash" class="form-control shadow"
        name="cash"/>
      </div>
      <div class="col">
        <input type="number" placeholder="VCash" id="Vodafone"  [(ngModel)]="paymentData.vodafoneCash" class="form-control shadow"
        name="Vodafone"/>
       </div>
      <div class="col">
        <input type="number" placeholder="Visa" id="visa"  [(ngModel)]="paymentData.visa" class="form-control shadow"
        name="visa"/>
      </div>
    </div>
    <div  class="row m-2 justify-content-between">
      <div class="col">
        <input type="number" placeholder="Credit" id="visa"  [(ngModel)]="paymentData.credit" class="form-control shadow"
        name="credit"/>
      </div>
      <div class="col">
        <input type="number" placeholder="InstaPay" id="visa"  [(ngModel)]="paymentData.instaPay" class="form-control shadow"
        name="InstaPay"/>
      </div>
     <div class="col">
      <input type="number" placeholder="Debit" id="debit"  [(ngModel)]="paymentData.debit" class="form-control shadow"
      name="debit"/>
     </div>
    </div>
    <div class="mt-3 d-flex justify-content-center" style=" margin-bottom: 25px;">
      <button type="submit"
        style="width: 120px; height: 30px; background-color: #1E3A8A; color: #fff; border: none; border-radius: 4px;">
        Reserve Package
      </button>

    </div>

    </form>
</div>
