<div class="dialog-shell">

  <!-- Header -->
  <div class="dialog-header">
    <div class="header-left">
      <div class="header-icon-wrap">
        <mat-icon>add_business</mat-icon>
      </div>
      <div class="header-text">
        <span class="header-eyebrow">Admin Action</span>
        <span class="header-title">Add New Clinic</span>
      </div>
    </div>
    <button mat-icon-button class="close-btn" (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="dialog-body">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Clinic Name</mat-label>
        <input matInput formControlName="clinicName" placeholder="e.g. Dermatology">
        <mat-icon matSuffix>business</mat-icon>
        <mat-error *ngIf="form.get('clinicName')?.hasError('required')">Clinic name is required</mat-error>
        <mat-error *ngIf="form.get('clinicName')?.hasError('pattern')">Must be at least 3 letters</mat-error>
      </mat-form-field>
    </form>
  </div>

  <!-- Footer -->
  <div class="dialog-footer">
    <button mat-stroked-button type="button" (click)="closeDialog()" class="footer-btn cancel-btn">
      <mat-icon>close</mat-icon> Cancel
    </button>
    <button mat-flat-button type="submit" (click)="submit()" [disabled]="form.invalid || isSubmitting"
      class="footer-btn submit-btn">
      <mat-icon>add_business</mat-icon>
      {{ isSubmitting ? 'Adding…' : 'Add Clinic' }}
    </button>
  </div>

</div>
