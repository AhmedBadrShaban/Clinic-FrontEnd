<div class="room-tabs-wrapper clinic-card" style="padding: 0;">
  <mat-tab-group [selectedIndex]="selectedIndex" (selectedIndexChange)="onTabChange($event)" animationDuration="200ms"
    dynamicHeight>

    <mat-tab *ngFor="let room of rooms; trackBy: trackByRoomId" [label]="room.roomName">
      <div class="tab-content">

        <app-events-grid [roomName]="room.roomName" [roomId]="room.roomId" [date]="selectedDate"
          [refreshTrigger]="refreshTrigger" (dataUpdated)="roomDataUpdated.emit(room.roomId)">
        </app-events-grid>

      </div>
    </mat-tab>

  </mat-tab-group>
</div>
