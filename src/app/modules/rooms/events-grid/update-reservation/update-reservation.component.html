<div class="container">
  <div class="Header text-center">
    Edit Reservation  
  </div>

  <div class="row">
    <form [formGroup]="formData" (ngSubmit)="update()" role="form">
      <div class="row m-2 mt-3 justify-content-between">
        <div class="form-group col-6">
         <label for="doctor-name" class="form-label w-100 ">Doctor Name</label><br>
         <input class="form-select" id="doctor-name" [value]="data.doctorName"
        formControlName="doctorName"
        nz-input
        (ngModelChange)="onChange($event)"
        [nzAutocomplete]="doctor"
      />
      <nz-autocomplete [nzDataSource]="FilterdNames" #doctor></nz-autocomplete>
      </div>
      <div class="form-group col-6">
        <label class="form-label w-100 ">Reservation Date:</label>
        <input class="form-control" type="date" formControlName="reservationDate" [value]="data.reservationDate"
        />
      </div>
      </div>
      <div class="row m-2 mt-3 justify-content-between">
        <div class="form-group col-6">
          <div class="row m-2">
            <div class="d-flex align-items-center">
              <label class="form-label w-100">From</label>
            </div>
            <input
              type="time"
              [value]="data.reservationStart"
              formControlName="reservationStart"
              id="from"
              class="form-control shadow"
              name="From"
            />
          </div>
          <div class="row m-2">
            <div class="d-flex align-items-center">
              <label class="form-label w-100">To</label>
            </div>
            <input
              type="time"
              [value]="data.reservationEnd"
               formControlName="reservationEnd"
              id="from"
              class="form-control shadow"
              name="to"
            />
          </div>
        </div>
        <div class="form-group col-6">
          <div class="d-flex align-items-center">
            <i class="bi bi-card-text me-2 fs-4" style="margin-bottom: 5px"></i>
            <label class="form-label w-100">Note</label>
          </div>
          <textarea
            id="note"
            rows="4"
            [value]="data.note"
            placeholder="Note"
            formControlName="note"
             class="form-control shadow"
          ></textarea>
        </div>
      </div>
      <div class="hr-container">
        <hr>
        <span class="hr-text">Services</span>
      </div>
       <div class="row m-2">
<div class="form-group w-100">
  <div class="row">
    <div *ngFor="let service of allServices" class="col-3">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" [id]="'flexCheck' + service" [value]="service"
          [checked]="selectedServices[service]" (change)="onCheckboxChange(service, $event)">
        <label class="form-check-label" [for]="'flexCheck' + service">
          {{ service }}
        </label>
      </div>
    </div>
  </div>
</div>

      </div>
      <div class="row m-2 mt-3 justify-content-center">
        <div class="form-group col-6">
          <div class="text-center">
            <button type="submit" class="btn btn-primary">Save Changes</button>
           </div>
        </div>
        <div class="form-group col-6">
          <a (click)="closeDialog()"  class="btn btn-danger">Cancel</a>
        </div>
       
     </div>
 </form>
  </div>
</div>
