<div class="rooms-container" *ngIf="dataLoaded; else loadingTemplate">
  <!-- Header -->
  <mat-card class="header-card">
    <mat-card-content>
      <div class="header-actions">
        <!-- Action Buttons -->
        <div class="action-buttons">
          <div class="add-actions">
<button *ngIf="isAdmin" mat-raised-button color="primary" (click)="openDialog('room')" class="action-btn">
  <mat-icon>add</mat-icon>
  Add Room
</button>
<button *ngIf="isAdmin" mat-raised-button color="primary" (click)="openDialog('clinic')" class="action-btn">
  <mat-icon>add_business</mat-icon>
  Add Clinic
</button>
<button mat-raised-button color="accent" (click)="openDialog('reservation', activeRoom, selectedDate)"
  [disabled]="!activeRoom" class="action-btn">
  <mat-icon>event_available</mat-icon>
  New Reservation
</button>
          </div>
          <mat-form-field *ngIf="isAdmin" appearance="outline" class="clinic-select">
            <mat-label>Select Clinic</mat-label>
            <mat-select [(value)]="selectedClinic" (selectionChange)="onClinicChange($event.value)">
              <mat-option *ngFor="let clinic of clinics" [value]="clinic">
                {{ clinic }}
              </mat-option>
            </mat-select>
          </mat-form-field>

        </div>
        <!-- Date Picker -->
        <mat-form-field appearance="outline" class="date-picker">
          <mat-label>Select Date</mat-label>
          <input matInput [value]="selectedDate" [matDatepicker]="picker" (dateChange)="onDateChange($event)" readonly>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Main Content -->
  <div>
    <!-- Tabs for Rooms -->
    <mat-tab-group [selectedIndex]="selectedTabIndex" (selectedIndexChange)="onTabChange($event)" class="room-tabs"
      dynamicHeight animationDuration="300ms">
      <mat-tab *ngFor="let room of rooms; trackBy: trackByRoomId" [label]="room.roomName">
        <!-- Lazy load tab content - Only render active tab -->
        <ng-container *ngIf="isActiveRoom(room.roomId)">
          <!-- Tab Content -->
          <div class="tab-content">
             <app-available-slots [roomName]="room.roomName" [reservedAt]="selectedDate"
              [refreshTrigger]="refreshTrigger">
            </app-available-slots>

            <!-- Events Grid - Let it fetch its own data -->
            <app-events-grid [roomName]="room.roomName" [roomId]="room.roomId" [date]="selectedDate"
              [refreshTrigger]="refreshTrigger" (dataUpdated)="refreshRoomData(room.roomId)" class="events-grid">
            </app-events-grid>
          </div>
        </ng-container>
      </mat-tab>
    </mat-tab-group>

    <!-- Empty State -->
    <div *ngIf="rooms.length === 0" class="empty-state">
      <mat-icon class="empty-icon">meeting_room</mat-icon>
      <h3>No Rooms Available</h3>
      <p>Add a new room to start managing reservations.</p>
      <button *ngIf="isAdmin" mat-raised-button color="primary" (click)="openDialog('room')">
        <mat-icon>add</mat-icon>
        Add First Room
      </button>
    </div>
  </div>
</div>

<!-- Loading Skeleton -->
<ng-template #loadingTemplate>
  <mat-card class="loading-card">
    <mat-card-content class="loading-content">
      <div class="loading-skeleton">
        <div class="skeleton-bar" *ngFor="let item of [1,2,3,4,5]"></div>
      </div>
    </mat-card-content>
  </mat-card>
</ng-template>
