<div class="rooms-container"  *ngIf="dataLoaded; else loadingTemplate" >
   <mat-card class="header-card">
    <mat-card-content>
      <div class="header-actions">
        <!-- Action Buttons -->
        <div class="action-buttons">
          <button 
            *ngIf="isAdmin" 
            mat-raised-button 
            color="primary" 
            (click)="openDialog('room')"
            class="action-btn">
            <mat-icon>add</mat-icon>
            Add Room
          </button>
          
          <button 
            *ngIf="isAdmin" 
            mat-raised-button 
            color="primary" 
            (click)="openDialog('clinic')"
            class="action-btn">
            <mat-icon>add_business</mat-icon>
            Add Clinic
          </button>
          
          <button 
            mat-raised-button 
            color="accent" 
            (click)="openDialog('reservation', activeRoom, selectedDate)"
            [disabled]="!activeRoom"
            class="action-btn">
            <mat-icon>event_available</mat-icon>
            New Reservation
          </button>
        </div>

        <!-- Date Picker -->
        <mat-form-field appearance="outline" class="date-picker">
          <mat-label>Select Date</mat-label>
          <input 
            matInput 
            [(ngModel)]="selectedDate" 
            [matDatepicker]="picker" 
            (dateChange)="onDateChange($event)"
            readonly>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Main Content -->
  <div>
    <!-- Tabs for Rooms -->
    <mat-tab-group 
      [(selectedIndex)]="selectedTabIndex" 
      (selectedIndexChange)="onTabChange($event)"
      class="room-tabs"
      dynamicHeight
      animationDuration="300ms">
      
      <mat-tab 
        *ngFor="let room of rooms; trackBy: trackByRoomId" 
        [label]="room.roomName">
        
        <!-- Available Slots Header -->
        <app-available-slots 
          [roomName]="room.roomName" 
          [reservedAt]="selectedDate">
        </app-available-slots>
        
         <app-events-grid
          [roomName]="room.roomName"
          [roomId]="room.roomId"
          [date]="selectedDate"
          class="events-grid">
        </app-events-grid>
      </mat-tab>
    </mat-tab-group>

    <!-- Empty State -->
    <div *ngIf="rooms.length === 0" class="empty-state">
      <mat-icon class="empty-icon">meeting_room</mat-icon>
      <h3>No Rooms Available</h3>
      <p>Add a new room to start managing reservations.</p>
      <button 
        *ngIf="isAdmin" 
        mat-raised-button 
        color="primary" 
        (click)="openDialog('room')">
        <mat-icon>add</mat-icon>
        Add First Room
      </button>
    </div>
  </div>
</div>
 <ng-template #loadingTemplate>
  <mat-card class="loading-card">
    <mat-card-content class="loading-content">
       <div class="loading-skeleton">
        <div class="skeleton-bar" *ngFor="let item of [1,2,3,4,5]"></div>
      </div>
    </mat-card-content>
  </mat-card>
</ng-template>
