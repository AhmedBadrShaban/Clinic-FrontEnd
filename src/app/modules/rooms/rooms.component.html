<div class="rooms-shell" *ngIf="dataLoaded; else loadingTpl">

  <!-- Header: clinic selector, date picker, action buttons -->
  <app-rooms-header [clinics]="clinics" [selectedClinic]="selectedClinic" [selectedDate]="selectedDate"
    [activeRoom]="activeRoom" [isAdmin]="isAdmin" [slotPickerOpen]="slotPickerOpen"
    (clinicChanged)="onClinicChanged($event)" (dateChanged)="onDateChanged($event)" (addRoom)="openAddRoomDialog()"
    (addClinic)="openAddClinicDialog()" (newReservation)="openNewReservationDialog()" (viewSlots)="onViewSlots()">
  </app-rooms-header>

  <!-- Room tabs — no slot picker logic here anymore -->
  <app-room-tabs [rooms]="rooms" [selectedIndex]="selectedTabIndex" [selectedDate]="selectedDate"
    [refreshTrigger]="refreshTrigger" (tabChanged)="onTabChanged($event)" (roomDataUpdated)="onRoomDataUpdated($event)"
    (openReservationWithSlot)="onOpenReservationWithSlot($event)" (viewReservation)="onViewReservation($event)">
  </app-room-tabs>

  <!-- Empty state -->
  <div *ngIf="rooms.length === 0" class="empty-state">
    <i class="bi bi-door-open empty-icon"></i>
    <h3>No rooms available</h3>
    <p>Add a room to start managing reservations.</p>
    <button *ngIf="isAdmin" class="btn-primary-clinic" (click)="openAddRoomDialog()">
      <i class="bi bi-plus-lg"></i> Add first room
    </button>
  </div>

</div>

<!-- Loading skeleton -->
<ng-template #loadingTpl>
  <div class="shell-loading">
    <div class="skeleton-header"></div>
    <div class="skeleton-tabs"></div>
    <div class="skeleton-body">
      <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5,6]"></div>
    </div>
  </div>
</ng-template>

<!-- Slot picker — owned at rooms level, rendered outside tab context -->
<app-slot-picker [isOpen]="slotPickerOpen" [reservedSlots]="activeRoomSlots" [reservations]="activeRoomReservations"
  [roomName]="activeRoom?.roomName ?? ''" [roomId]="activeRoom?.roomId ?? 0" [date]="selectedDate"
  (closed)="onSlotPickerClosed()" (slotSelected)="onSlotSelected($event)"
  (reservationClicked)="onViewReservation($event)">
</app-slot-picker>
