<!-- Animated background canvas -->
<div class="login-scene">

  <!-- Floating orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>

  <!-- Grid overlay -->
  <div class="grid-overlay"></div>

  <!-- Login card -->
  <div class="login-card">

    <!-- Left panel -->
    <div class="card-left">
      <div class="brand-mark">
        <div class="brand-ring"></div>
        <img src="../../../assets/logo.png" alt="Logo" class="brand-logo" />
      </div>
      <h1 class="brand-title">Welcome<br><em>Back</em></h1>
      <p class="brand-sub">Your clinic dashboard<br>is waiting for you.</p>
      <div class="left-deco">
        <div class="deco-line"></div>
        <div class="deco-dot"></div>
        <div class="deco-line short"></div>
      </div>
    </div>

    <!-- Right panel: form -->
    <div class="card-right">
      <div class="form-header">
        <span class="form-eyebrow">Staff Portal</span>
        <h2 class="form-title">Sign In</h2>
      </div>

      <div class="field-group">
        <label class="field-label" for="username">Username</label>
        <div class="field-wrap">
          <span class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            id="username"
            type="text"
            placeholder="Enter your username"
            class="field-input"
            #username
            required />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="field-wrap">
          <span class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            class="field-input"
            #password
            required />
        </div>
      </div>

      <button class="login-btn" (click)="onLoginClicked()">
        <span class="btn-text">Sign In</span>
        <span class="btn-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
        <div class="btn-shimmer"></div>
      </button>

<p class="form-footer">
  UClinic Management System
  <br>
<span class="footer-rights"><strong>Development Team</strong> © 2026  · All rights reserved</span></p>
 </div>

  </div>
</div>
