<div class="container-xl px-4 mt-4">
  <div class="row">
    <div class="col-xl-4">
      <div *ngIf="doctorData" class="card mb-4 mb-xl-0">
        <div class="card-header">Main Info</div>
        <div class="card-body text-center">
          <!-- Profile picture image-->
          <img
            class="img-account-profile rounded-circle mb-2"
            src="https://png.pngtree.com/png-clipart/20210913/ourlarge/pngtree-professional-female-doctor-character-png-image_3915444.jpg"
            alt=""
          />

          <div class="small font-italic text-muted mb-2">
            {{ doctorData.doctor?.username! }}
          </div>
          <div class="small font-italic text-muted mb-2">
            {{ doctorData.email }}
          </div>

          <!-- <div class="small font-italic text-muted mb-2">status</div>
                  <button ng class="btn btn-primary" type="button"  *ngIf="!doctorData.isActive" >Suspended</button>
                  <button ng class="btn btn-primary" type="button"  *ngIf="doctorData.isActive"  >Active</button> -->
        </div>
      </div>
    </div>
    <div class="col-xl-8">
      <!-- Account details card-->
      <div *ngIf="doctorData" class="card mb-4">
        <div class="card-header">Account Details</div>
        <div class="card-body">
          <form>
            <div class="row m-2 mt-4 justify-content-between">
              <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-person me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                    <label class="form-label w-100">Name</label>
                  </div>
                  <input
                    type="text"
                    class="form-control shadow"
                    name="name"
                    [(ngModel)]="doctorData.doctorName"
                    value="{{ doctorData.doctorName }}"
                  />
                </div>
              </div>
              <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                    <label class="form-label w-100">phoneNumber</label>
                  </div>
                  <input
                    type="text"
                    class="form-control shadow"
                    value="{{ doctorData.phoneNumber }}"
                    name="number"
                    [(ngModel)]="doctorData.phoneNumber"
                  />
                  <div *ngIf="!validatePhoneNumber(doctorData.phoneNumber)" style="color: red; font-size: 12px;">Invalid, phone number should Be 11 Digit</div>
                </div>
              </div>
            </div>
            <div class="row m-2 mt-4 justify-content-between">
              <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-globe me-2 fs-4" style="margin-bottom: 5px;"></i> -->
                    <label class="form-label w-100">NationalId</label>
                  </div>
                  <input
                    type="text"
                    value="{{ doctorData.nationalID }}"
                    name="nationalid"
                    [(ngModel)]="doctorData.nationalID"
                    class="form-control shadow"
                  />
                  <div *ngIf="!validateNid(doctorData.nationalID)" style="color: red; font-size: 12px;">Invalid! nationalID should Be 14 Digit </div>

                </div>
              </div>
              <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                    <label class="form-label w-100">Address</label>
                  </div>
                  <input
                    type="text"
                    class="form-control shadow"
                    value="{{ doctorData.address}}"
                    name="address"
                    [(ngModel)]="doctorData.address"

                  />
                </div>
              </div>
            </div>
            <div class="row m-2 mt-4 justify-content-between">
              <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-envelope me-2 fs-4" style="margin-bottom: 5px;"></i> -->
                    <label class="form-label w-100">Email</label>
                  </div>
                  <input
                    type="text"
                    class="form-control shadow"
                    name="email"
                    value="{{ doctorData.email }}"
                    [(ngModel)]="doctorData.email"
                  />
                </div>
              </div>
              <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-globe me-2 fs-4" style="margin-bottom: 5px;"></i> -->

                    <label class="form-label w-100">Is Laser</label>
                  </div>
                  <input
                    *ngIf="doctorData.isLaser == false"
                    [disabled]="true"
                    type="text"
                    name="islaser"
                    class="form-control bg-light"
                    value="true"
                  />
                  <input
                    *ngIf="doctorData.isLaser != false"
                    [disabled]="true"
                    name="islaser"
                    type="text"
                    class="form-control bg-light"
                    value="false"
                  />
                </div>
              </div>
            </div>
            <div class="row m-2 mt-4 justify-content-between">
              <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                    <label class="form-label w-100">Price per hour</label>
                  </div>
                  <input
                   [disabled]="true"
                    type="number"
                    value="{{ doctorData.pricePerHour }}"
                    name="pricePerHour"
                    class="form-control bg-light"
                   />
                </div>
              </div>
             <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-globe me-2 fs-4" style="margin-bottom: 5px;"></i> -->
                    <label class="form-label w-100">pulsesPercentage</label>
                  </div>
                  <input
                  [disabled]="true"
                   type="number"
                    value="{{ doctorData.pulsesPercentage }}"
                    name="pulsesPercentage"
                    class="form-control bg-light"
                  />
                </div>
              </div>

            </div>

            <div class="row m-2 mt-4 justify-content-between">
              <div class="col-5">
                <div class="row">
                  <div class="d-flex align-items-center">
                    <!-- <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                    <label class="form-label w-100">Password</label>
                  </div>
                  <input
                    type="text"
                    class="form-control shadow"
                    name="password"
                    [(ngModel)]="newPassword"
                    value="{{ doctorData.doctor?.password! }}"
                  />
                </div>
              </div>
            <!-- Save changes button-->
              <div class="col-5"  style="display: flex; justify-content: center; align-items: center;">
                <div class="row">
                  <button (click)="submit()" class="btn btn" type="button"
                  style="background-color: #A379D5; color: white;">Save changes</button>
                </div>
              </div>
            </div>


          </form>
        </div>
      </div>
    </div>
  </div>
</div>
