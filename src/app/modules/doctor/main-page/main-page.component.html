<div class="whole">
  <div *ngFor="let r of reservations" (click)="openReservation(r.patientPhone , r.reservationId )" class="the-box">
    <div class="left-part">
      <div style="display: flex;justify-content: center; margin-top: 2%; margin-bottom: 3%;
                  font-size: 27px ; font-weight: 800">
        {{r.patientName}}
      </div>

      <div class="container">
        <div *ngFor="let s of r.service" class="service-class">
            {{s}}
        </div>
      </div>
    </div>
    <div class="right-part">
      <div>
        <img src="../../../assets/onTime.png" height="50" width="50"/>
      </div>
      <div style="margin: 5%;">
        {{formatTimeTo12Hour(r.start)}}
      </div>
    </div>
  </div>

</div>
