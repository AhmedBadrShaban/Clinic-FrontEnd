<div class="admin-shell" [class.sidebar-collapsed]="sidebar.isCollapsed">

  <!-- Persistent sidebar -->
  <app-admin-sidebar #sidebar (isCollapsedChange)="onSidebarToggle($event)"></app-admin-sidebar>

  <!-- Main content area -->
  <div class="admin-main">

    <!-- Top bar -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <!-- Hamburger: mobile only -->
        <button class="hamburger-btn" (click)="sidebar.mobileOpen = true" title="Open menu">
          <i class="bi bi-list"></i>
        </button>

        <!-- Page identity: icon + title + description, driven by the active sidebar nav item -->
        <i class="bi topbar-page-icon" [ngClass]="sidebar.currentPageIcon" *ngIf="sidebar.currentPageIcon"></i>
        <div class="topbar-page-text">
          <span class="page-title">{{ sidebar.currentPageTitle }}</span>
          <span class="page-subtitle" *ngIf="sidebar.currentPageDescription">{{ sidebar.currentPageDescription }}</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="clinic-name">U Clinic</span>
        <div class="avatar" title="Admin">A</div>
      </div>
    </header>

    <!-- Routed page content -->
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
