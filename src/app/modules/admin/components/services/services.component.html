<div class="sv-page">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="page-icon">🩺</div>
      <div>
        <h1 class="page-title">Services</h1>
        <p class="page-subtitle">Manage your clinic services and doctor payment rules</p>
      </div>
    </div>
    <div class="top-bar-right">
      <div class="search-wrapper">
        <span class="search-icon">⌕</span>
        <input class="search-input" placeholder="Search services..." type="search" nz-input
          [(ngModel)]="searchValue" [ngModelOptions]="{standalone: true}"
          (ngModelChange)="onChange($event)" (keyup.enter)="search()"
          [nzAutocomplete]="MaterialAuto" />
        <nz-autocomplete [nzDataSource]="filteredData" #MaterialAuto></nz-autocomplete>
        <button class="btn-search" (click)="search()">Search</button>
        <button class="btn-clear" (click)="clearSearch()" *ngIf="searchValue">✕</button>
      </div>
      <button class="btn-add" (click)="openDialog()">
        <span class="btn-add-icon">+</span>
        Add Service
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card">

    <div class="table-scroll">
      <table class="pkg-table">
        <thead>
          <tr>
            <th>Name</th>
            <th class="center-cell">Cost</th>
            <th>Rooms</th>
            <th>Doctor Payment</th>
            <th class="center-cell">Status</th>
            <th class="center-cell">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of services; let i = index" [class.row-even]="i % 2 === 0">
            <td class="name-cell">{{ data.serviceName }}</td>
            <td class="num-cell center-cell">{{ data.costPerSession }}</td>
            <td>
              <span *ngFor="let room of data.rooms; let last = last">
                {{ room.roomName }}<ng-container *ngIf="!last">, </ng-container>
              </span>
            </td>
            <td class="num-cell">{{ billingLabel(data) }}</td>
            <td class="center-cell">
              <button class="status-toggle" [class.status-active]="data.isActive" [class.status-inactive]="!data.isActive"
                (click)="switchStatus(data.patientServiceId)">
                <span class="status-dot"></span>
                {{ data.isActive ? 'Active' : 'Not Active' }}
              </button>
            </td>
            <td class="center-cell">
              <button class="btn-edit" (click)="openEditDialog(data)">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-bar">
      <div class="pagination-info">Page {{ pageIndex }} of {{ totalPages }} · {{ totalItems }} items</div>
      <div class="pagination-controls">
        <button class="pg-btn" [disabled]="pageIndex === 1" (click)="onPageChange(pageIndex - 1)">‹</button>
        <button class="pg-btn pg-num" *ngFor="let p of pages" [class.pg-active]="p === pageIndex" (click)="onPageChange(p)">{{ p }}</button>
        <button class="pg-btn" [disabled]="pageIndex === totalPages" (click)="onPageChange(pageIndex + 1)">›</button>
      </div>
    </div>

  </div>
</div>
