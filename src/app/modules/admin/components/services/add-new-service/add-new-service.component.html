
<div class="border  rounded container  shadow"
    style="width:600px; background-color: #F8F8F8;border: none;">

    <form [formGroup]="newServiceFm" (ngSubmit)="submit()" >
        <div class="row m-2 mt-4 justify-content-between">
            <div class="col-5">
                <div class="row">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-person me-2 fs-4" style="margin-bottom: 7px;"></i>
                        <label class="form-label w-100">Service Name</label>
                    </div>
                    <input type="text" formControlName="serviceName" placeholder="Name" id="Name" class="form-control shadow" />

                </div>

            </div>

               <div class="col-5">
                <div class="row">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-currency-pound me-2 fs-4" style="margin-bottom: 7px;"></i>
                        <label class="form-label w-100">Cost Per Seesion</label>
                    </div>
                    <input type="number" formControlName="costPerSession" placeholder="cost" id="cost" class="form-control shadow" />

                </div>

            </div>
            <div class="col-12 my-2">
              <div class="d-flex align-items-center">
                 <i class="bi bi-house-gear me-2 fs-4" style="margin-bottom: 5px;"></i>
                 <label class="form-label w-100">Room</label>
             </div>
             <!-- <input type="text" formControlName="room" placeholder="room" id="room" class="form-control shadow"  /> -->
             <select class="form-select shadow" name="room" formControlName="rooms" multiple>
                 <option [selected]="true" [disabled]="true">Choose Rooms</option>
                 <option *ngFor="let room of allRooms" [value]="room">{{room}}</option>
             </select>
         </div>
          </div>



        <div class="mt-3 d-flex justify-content-center" style=" margin-bottom: 25px;">
            <button type="submit"
                style="width: 160px; height: 40px; background-color: green; color: #fff; border: none; border-radius: 4px;">Add
                Service
            </button>
        </div>
    </form>
