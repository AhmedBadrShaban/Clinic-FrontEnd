<div class="border rounded container shadow" style="width: 600px; background-color: #F8F8F8; border: none;">

  <form [formGroup]="newServiceFm" (ngSubmit)="submit()">
    <!-- Service Name -->
    <div class="row m-2 mt-4 justify-content-between">
      <div class="col-5">
        <div class="row">
          <div class="d-flex align-items-center">
            <i class="bi bi-person me-2 fs-4" style="margin-bottom: 7px;"></i>
            <label class="form-label w-100">Service Name</label>
          </div>
          <input type="text" formControlName="serviceName" placeholder="Name" id="Name" class="form-control shadow" />
           <div *ngIf="newServiceFm.get('serviceName')!.hasError('required') && newServiceFm.get('serviceName')!.touched">
            Service Name is required.
          </div>
          <div *ngIf="newServiceFm.get('serviceName')!.hasError('pattern') && newServiceFm.get('serviceName')!.touched">
            Service Name should contain only letters, numbers, and spaces.
          </div>
        </div>
      </div>

      <!-- Cost Per Session -->
      <div class="col-5">
        <div class="row">
          <div class="d-flex align-items-center">
            <i class="bi bi-currency-pound me-2 fs-4" style="margin-bottom: 7px;"></i>
            <label class="form-label w-100">Cost Per Session</label>
          </div>
          <input type="number" formControlName="costPerSession" placeholder="cost" id="cost" class="form-control shadow" />
           <div *ngIf="newServiceFm.get('costPerSession')!.hasError('required') && newServiceFm.get('costPerSession')!.touched">
            Cost Per Session is required.
          </div>
        </div>
      </div>

      <!-- Room -->
      <div class="col-12 my-2">
        <div class="d-flex align-items-center">
          <i class="bi bi-house-gear me-2 fs-4" style="margin-bottom: 5px;"></i>
          <label class="form-label w-100">Room</label>
        </div>
        <select class="form-select shadow" name="room" formControlName="rooms" multiple>
          <option [selected]="true" [disabled]="true">Choose Rooms</option>
          <option *ngFor="let room of allRooms" [value]="room">{{room}}</option>
        </select>
         <div *ngIf="newServiceFm.get('rooms')!.hasError('required') && newServiceFm.get('rooms')!.touched">
          Room is required.
        </div>
      </div>

      <!-- Billing Model -->
      <div class="col-12 my-2">
        <div class="d-flex align-items-center">
          <i class="bi bi-cash-coin me-2 fs-4" style="margin-bottom: 5px;"></i>
          <label class="form-label w-100">Doctor Payment Model</label>
        </div>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="billingModel" id="bm-none" value="none" formControlName="billingModel">
          <label class="btn btn-outline-secondary" for="bm-none">None</label>
          <input type="radio" class="btn-check" name="billingModel" id="bm-fixed" value="fixed" formControlName="billingModel">
          <label class="btn btn-outline-secondary" for="bm-fixed">Fixed Fee</label>
          <input type="radio" class="btn-check" name="billingModel" id="bm-percentage" value="percentage" formControlName="billingModel">
          <label class="btn btn-outline-secondary" for="bm-percentage">Percentage</label>
        </div>
      </div>

      <!-- Fixed Fee -->
      <div class="col-12 my-2" *ngIf="newServiceFm.get('billingModel')!.value === 'fixed'">
        <div class="d-flex align-items-center">
          <label class="form-label w-100">Fixed Doctor Fee</label>
        </div>
        <input type="number" formControlName="fixedDoctorFee" placeholder="e.g. 20" class="form-control shadow" />
      </div>

      <!-- Percentage -->
      <div class="col-6 my-2" *ngIf="newServiceFm.get('billingModel')!.value === 'percentage'">
        <div class="d-flex align-items-center">
          <label class="form-label w-100">Material Cost</label>
        </div>
        <input type="number" formControlName="materialCost" placeholder="e.g. 50" class="form-control shadow" />
      </div>
      <div class="col-6 my-2" *ngIf="newServiceFm.get('billingModel')!.value === 'percentage'">
        <div class="d-flex align-items-center">
          <label class="form-label w-100">Doctor Percentage</label>
        </div>
        <input type="number" formControlName="doctorPercentage" placeholder="0.1 = 10%" step="0.01" class="form-control shadow" />
      </div>
    </div>

    <!-- Submit Button -->
    <div class="mt-3 d-flex justify-content-center" style="margin-bottom: 25px;">
      <button type="submit"
        style="width: 160px; height: 40px; background-color: green; color: #fff; border: none; border-radius: 4px;">{{ editing ? 'Save Changes' : 'Add Service' }}
      </button>
    </div>
  </form>
</div>
