<div class="container-xl px-4 mt-4">

    <div class="row">
        <div class="col-xl-4">

            <div class="card mb-4 mb-xl-0">
                <div class="card-header">Main Info</div>
                <div class="card-body text-center">

                    <!-- Profile picture image-->
                    <img class="img-account-profile rounded-circle mb-2"
                        src="https://png.pngtree.com/png-clipart/20210913/ourlarge/pngtree-professional-female-doctor-character-png-image_3915444.jpg"
                        alt="">

                     <div class="small font-italic text-muted mb-2">{{doctorData.userName}} </div>
                    <div class="small font-italic text-muted mb-2">{{doctorData.email}}</div>

                     <div class="small font-italic text-muted mb-2">status</div>
                    <button ng class="btn btn-primary" type="button"  *ngIf="doctorData.isActive== 'false' "  (click)="switchStatus(doctorData.userName)">Suspended</button>
                    <button ng class="btn btn-primary" type="button"  *ngIf="doctorData.isActive == 'true' "  (click)="switchStatus(doctorData.userName)">Active</button>
                              </div>
            </div>
        </div>
        <div class="col-xl-8">
            <!-- Account details card-->
            <div class="card mb-4">
                <div class="card-header">Account Details</div>
                <div class="card-body">
                    <form>
                        <div class="row m-2 mt-4 justify-content-between">
                            <div class="col-5">
                                <div class="row">
                                    <div class="d-flex align-items-center">
                                        <!-- <i class="bi bi-person me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                                        <label class="form-label w-100">Name</label>
                                    </div>
                                    <input type="text" class="form-control shadow" value="{{doctorData.doctorName}}" />

                                </div>

                            </div>

                            <div class="col-5">

                                <div class="row">
                                     <div class="d-flex align-items-center">
                                      <!-- <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                                      <label class="form-label w-100">Password</label>
                                    </div>
                                    <input type="text" class="form-control shadow" value="{{doctorData.password}}" />
                                </div>

                            </div>

                        </div>
                        <div class="row m-2 mt-4 justify-content-between">
                            <div class="col-5">
                                <div class="row">
                                    <div class="d-flex align-items-center">
                                        <!-- <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                                        <label class="form-label w-100">phoneNumber</label>
                                    </div>
                                    <input type="text" class="form-control shadow" value="{{doctorData.phoneNumber}}" />

                                </div>

                            </div>

                            <div class="col-5">
                                <div class="row">
                                    <div class="d-flex align-items-center">
                                        <!-- <i class="bi bi-globe me-2 fs-4" style="margin-bottom: 5px;"></i> -->
                                        <label class="form-label w-100">NationalId</label>
                                    </div>
                                    <input type="text" value="{{doctorData.nationalId}}" class="form-control shadow" />

                                </div>

                            </div>

                        </div>
                        <div class="row m-2 mt-4 justify-content-between">
                            <div class="col-5">
                                <div class="row">
                                    <div class="d-flex align-items-center">
                                        <!-- <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                                        <label class="form-label w-100">Address</label>
                                    </div>
                                    <input type="text" class="form-control shadow" value="{{doctorData.address}}" />

                                </div>

                            </div>

                            <div class="col-5">
                                <div class="row">
                                  <div class="d-flex align-items-center">
                                    <!-- <i class="bi bi-envelope me-2 fs-4" style="margin-bottom: 5px;"></i> -->
                                    <label class="form-label w-100">Email</label>
                                </div>
                                <input type="text" class="form-control shadow" value="{{doctorData.email}}" />
                                </div>
                            </div>

                        </div>
                        <div class="row m-2 mt-4 justify-content-between">
                            <div class="col-5">
                                <div class="row">
                                    <div class="d-flex align-items-center">
                                        <!-- <i class="bi bi-telephone me-2 fs-4" style="margin-bottom: 7px;"></i> -->
                                        <label class="form-label w-100">Price per hour</label>
                                    </div>
                                    <input type="number" value="{{doctorData.pricePerHour}}" class="form-control shadow"
                                        name="phone1" />

                                </div>

                            </div>

                            <div class="col-5">
                                <div class="row">
                                    <div class="d-flex align-items-center">
                                        <!-- <i class="bi bi-globe me-2 fs-4" style="margin-bottom: 5px;"></i> -->

                                        <label class="form-label w-100">isLiser</label>
                                    </div>
                                    <input *ngIf="doctorData.isLaser==false" type="text" class="form-control shadow"
                                        value="true" />
                                    <input *ngIf="doctorData.isLaser!=false" type="text" class="form-control shadow"
                                        value="false" />
                                </div>

                            </div>

                        </div>

                        <div class="row m-2 mt-4 justify-content-between">
                            <div class="col-5">
                                <div class="row">
                                    <div class="d-flex align-items-center">
                                        <!-- <i class="bi bi-globe me-2 fs-4" style="margin-bottom: 5px;"></i> -->
                                        <label class="form-label w-100">pulsesPercentage</label>
                                    </div>
                                    <input type="number" value="{{doctorData.pulsesPercentage}}"
                                        class="form-control shadow" name="phone2" />

                                </div>

                            </div>

                        </div>

                        <!-- Save changes button-->
                        <button class="btn btn" type="button"
                            style="background-color: #A379D5; margin-left: 41%; color: white;">Save changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
