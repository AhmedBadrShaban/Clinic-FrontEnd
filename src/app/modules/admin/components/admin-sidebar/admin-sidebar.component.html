<aside class="sidebar" [class.collapsed]="isCollapsed">

  <!-- Logo & Toggle -->
  <div class="sidebar-header">
    <div class="logo-wrap" *ngIf="!isCollapsed">
      <img src="assets/logo.png" alt="Clinic logo" class="logo-img" />
    </div>
    <!-- <button class="toggle-btn" (click)="toggleSidebar()" [title]="isCollapsed ? 'Expand menu' : 'Collapse menu'">
      <i class="bi" [ngClass]="isCollapsed ? 'bi-layout-sidebar' : 'bi-layout-sidebar-reverse'"></i>
    </button> -->
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul>
      <li *ngFor="let item of navItems" [class.nav-group]="item.children?.length">

        <!-- ── Leaf item (no children) ── -->
        <a *ngIf="!item.children?.length" [routerLink]="item.route" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }" [title]="isCollapsed ? item.label : ''" class="nav-link">
          <i class="bi {{ item.icon }} nav-icon"></i>
          <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
        </a>

        <!-- ── Group trigger (has children) ── -->
        <ng-container *ngIf="item.children?.length">

          <button class="nav-link nav-group-trigger" (click)="toggleGroup(item)" [title]="isCollapsed ? item.label : ''"
            [class.group-open]="isGroupOpen(item)">
            <i class="bi {{ item.icon }} nav-icon"></i>
            <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
            <i class="bi nav-group-chevron" *ngIf="!isCollapsed"
              [ngClass]="isGroupOpen(item) ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
          </button>

          <!-- Expanded sub-menu -->
          <ul class="nav-sub" [class.open]="isGroupOpen(item) && !isCollapsed">
            <li *ngFor="let child of item.children">
              <a [routerLink]="child.route" routerLinkActive="active" class="nav-link nav-sub-link"
                [title]="child.label">
                <i class="bi {{ child.icon }} nav-icon nav-icon--sub"></i>
                <span class="nav-label">{{ child.label }}</span>
              </a>
            </li>
          </ul>

          <!-- Collapsed icon-only flyout -->
          <ul class="nav-sub-flyout" *ngIf="isCollapsed">
            <li *ngFor="let child of item.children">
              <a [routerLink]="child.route" routerLinkActive="active" class="nav-link" [title]="child.label">
                <i class="bi {{ child.icon }} nav-icon"></i>
              </a>
            </li>
          </ul>

        </ng-container>
      </li>
    </ul>
  </nav>

  <!-- Bottom: Logout -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()" [title]="isCollapsed ? 'Logout' : ''">
      <i class="bi bi-box-arrow-left nav-icon"></i>
      <span class="nav-label" *ngIf="!isCollapsed">Logout</span>
    </button>
  </div>

</aside>
