<div class="container">
  <div class="row">
    <form [formGroup]="formData" (ngSubmit)="UpdateInfo()" role="form">
      <div class="row my-3 justify-content-between">
        <div class="form-group col-6">
          <label class="control-label">Name:</label>
          <input class="form-control" formControlName="name" />
        </div>
        <div class="form-group col-6">
          <label class="control-label">Gender:</label>
          <input class="form-control" formControlName="gender" />
        </div>
      </div>

      <div class="row my-3 justify-content-between">
        <div class="form-group col-6">
          <label class="control-label">Primary Phone Number:</label>
          <input class="form-control" formControlName="primaryPhone" />
        </div>
        <div class="form-group col-6">
          <label class="control-label">Secondary Phone Number:</label>
          <input class="form-control" formControlName="secondaryPhone" />
        </div>
      </div>

      <div class="row my-3 justify-content-between">
        <div class="form-group col-6">
          <label class="control-label">Joined At:</label>
          <input class="form-control" type="date" formControlName="date" />
        </div>
        <div class="form-group col-6">
          <label class="control-label">Know Us From:</label>
          <input class="form-control" formControlName="knowUsThrough" />
        </div>
      </div>

      <div class="row my-3 justify-content-between">
        <div class="form-group col-6">
          <label class="control-label">Last Reservation:</label>
          <input class="form-control" type="date" formControlName="lastReservation" />
        </div>
        <div class="form-group col-6">
          <label class="control-label">Note:</label>
          <input class="form-control" formControlName="note" />
        </div>
      </div>

      <div class="row my-3 justify-content-center">
        <div class="form-group col-12">
          <label class="control-label"></label>
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <span></span>
          <button type="button" (click)="cancel()" class="btn btn-default">Cancel</button>
        </div>
      </div>
    </form>
  </div>
</div>
